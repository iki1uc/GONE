@keyframes blinkHard{
  0%,49%{
    opacity:1
  }
  50%,100%{
    opacity:.15
  }
}
@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}
@keyframes spinRev{
  to{
    transform:rotate(-360deg)
  }
}
@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }
  50%{
    transform:scale(2.1);
    opacity:.35
  }
}
@keyframes pulseRing{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 0 0 rgba(232,200,122,.45)
  }
  50%{
    transform:scale(1.06);
    box-shadow:0 0 0 14px rgba(232,200,122,0)
  }
}
@keyframes riseBar{
  from{
    height:8%
  }
  to{
    height:96%
  }
}
@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }
  50%{
    transform:translateY(-10px) rotate(3deg)
  }
}
@keyframes confetti{
  0%{
    transform:translateY(-10px) rotate(0)
  }
  100%{
    transform:translateY(420px) rotate(540deg)
  }
}
@keyframes marqueeX{
  from{
    transform:translateX(0)
  }
  to{
    transform:translateX(-50%)
  }
}
@keyframes flashAll{
  0%,100%{
    opacity:0
  }
  12%,45%{
    opacity:1
  }
}
@keyframes wiggle{
  0%,100%{
    transform:rotate(-2deg)
  }
  50%{
    transform:rotate(2deg)
  }
}
.blink{
  animation:blinkHard 1s steps(1) infinite;
}
.spin-slow{
  animation:spinSlow 14s linear infinite;
}
.spin-rev{
  animation:spinRev 20s linear infinite;
}
.pulse-dot{
  animation:pulseDot 1.1s ease-in-out infinite;
}
.pulse-ring{
  animation:pulseRing 1.6s ease-in-out infinite;
}
.floaty{
  animation:floaty 3s ease-in-out infinite;
}
.wiggle{
  animation:wiggle .35s ease-in-out infinite;
}
.flash-overlay{
  animation:flashAll .9s ease-out 1;
}
.marquee-track{
  animation:marqueeX 12s linear infinite;
}
.confetti-bit{
  animation:confetti 3.2s linear infinite;
}
