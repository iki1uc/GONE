:root{
  --bg:#070b12;
  --surface:#101827;
  --surface2:#182335;
  --glass:rgba(20,32,50,.82);
  --line:#3b536f;
  --text:#f6f8ff;
  --muted:#cbd6e6;
  --gold:#ffd66b;
  --teal:#7fe7c8;
  --blue:#8ecbff;
  --soft:#ffe9a8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#070b12;
    --surface:#101827;
  }
}
*{
  box-sizing:border-box
}
html{
  scroll-behavior:smooth
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Verdana, Geneva, Tahoma, sans-serif;
  font-size:18px;
  line-height:1.65
}
button,input{
  font:inherit
}
button{
  cursor:pointer
}
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(10px)
}
.pill{
  border:1px solid var(--line);
  border-radius:999px;
  padding:.55rem 1rem;
  background:#0d1726;
  color:var(--text)
}
.pill.active{
  background:var(--gold);
  color:#171204;
  border-color:var(--gold);
  font-weight:800
}
.bar-track{
  height:26px;
  background:#0a1422;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden
}
.bar-fill{
  height:100%;
  border-radius:999px;
  transition:width 2200ms linear
}
.tex-tile{
  min-height:86px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0d1726;
  padding:10px;
  text-align:left;
  color:var(--text);
  word-break:break-all
}
.tex-tile:hover,.tex-tile:focus-visible{
  border-color:var(--gold);
  outline:3px solid var(--gold);
  outline-offset:2px
}
.tex-tile.sample{
  border-color:var(--gold);
  background:#2a230f;
  box-shadow:0 0 0 2px rgba(255,214,107,.25)
}
.focusable:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px
}
