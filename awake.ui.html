  /* 2 */

  outline: auto;

  box-shadow: none;

/*

progress {
  vertical-align: baseline;
}
/*
Correct the cursor style of increment and decrement buttons in Safari.

::-webkit-inner-spin-button,
::-webkit-outer-spin-button {
  height: auto;
}
/*
1. Correct the odd appearance in Chrome and Safari.
2. Correct the outline style in Safari.
*/
[type='search'] {
  -webkit-appearance: textfield;
  /* 1 */
  outline-offset: -2px;
  /* 2 */
}
/*

  -webkit-appearance: none;
}
/*
1. Correct the inability to style clickable types in iOS and Safari.

::-webkit-file-upload-button {
  -webkit-appearance: button;
  /* 1 */
  font: inherit;
  /* 2 */
}
/*
Add the correct display in Chrome and Safari.

summary {
  display: list-item;
}
/*
Removes the default spacing and border for appropriate elements.

blockquote,
dl,
dd,
h1,
h2,
h3,
h4,
h5,
h6,
hr,
figure,
p,
pre {
  margin: 0;
}
fieldset {
  margin: 0;
  padding: 0;
}
legend {
  padding: 0;
}
ol,
ul,
menu {
  list-style: none;
  margin: 0;
  padding: 0;
}
/*

dialog {
  padding: 0;
}
/*

}

  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */
}
input::placeholder,
textarea::placeholder {
  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */
}
/*
Set the default cursor for buttons.
*/
button,
[role="button"] {
  cursor: pointer;
}
/*

*/
:disabled {
  cursor: default;
}

svg,

audio,
iframe,
embed,
object {

  /* 1 */
  vertical-align: middle;
  /* 2 */

img,
video {
  max-width: 100%;
  height: auto;
}
/* Make elements with the HTML hidden attribute stay hidden by default */
[hidden]:where(:not([hidden="until-found"])) {
  display: none;
}
.block {
  display: block;
}
.flex {
  display: flex;
}
.grid {
  display: grid;
}
.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
:root {
  --bg: #111;
  --surface: #222;
  --line: #444;
  --ink: #eee;
  --pink: #ff66aa;
  --green: #3ddc84;
  --red: #ff5d5d;
  --yellow: #ffd84d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111;
    --surface: #222;
    --line: #444;
    --ink: #eee;
    --pink: #ff66aa;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}
.awake-wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 40px;
  overflow-x: clip;
}
@media (max-width: 600px) {
  .awake-wrap {
    padding: 24px 16px 32px;
  }
}
.box {
  background: #222;
  border: 1px solid #444;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 4px;
}
.box h2 {
  margin: 0 0 8px;
  font-size: 1.15em;
  color: #fff;
}
.box p {
  margin: 0;
  line-height: 1.55;
}
.box pre {
  margin: 12px 0 0;
  white-space: pre-wrap;
  font-family: "Courier New", monospace;
  line-height: 1.6;
}
.strip {
  border: 1px solid #444;
  background: #191919;
  padding: 10px 12px;
  margin: 0 0 20px;
  text-align: center;
  font-size: 13px;
  letter-spacing: .02em;
  line-height: 1.6;
}
.choice-btn {
  border: 1px solid #555;
  background: #1a1a1a;
  color: #eee;
  padding: 8px 10px;
  cursor: pointer;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  border-radius: 3px;
}
.choice-btn:hover {
  border-color: #ff66aa;
}
.choice-btn[aria-pressed="true"] {
  background: #ff66aa;
  border-color: #ff66aa;
  color: #111;
  font-weight: 700;
}
.choice-btn:disabled, .awake-btn:disabled {
  opacity: .55;
  cursor: wait;
}
.awake-btn {
  width: 100%;
  border: 1px solid #ff66aa;
  background: #ff66aa;
  color: #111;
  font-weight: 800;
  font-size: 17px;
  padding: 14px;
  cursor: pointer;
  border-radius: 3px;
  font-family: Arial, Helvetica, sans-serif;
  letter-spacing: .04em;
}
.awake-btn:hover {
  filter: brightness(1.08);
}
input[type="range"] {
  width: 100%;
  accent-color: #ff66aa;
}
.log-scroll {
  max-height: 220px;
  overflow-y: auto;
  overflow-x: clip;
}
.log-scroll::-webkit-scrollbar {
  width: 8px;
}
.log-scroll::-webkit-scrollbar-thumb {
  background: #444;
}
.pulse-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(61,220,132,.6);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(61,220,132,.5);
  }
  70% {
    box-shadow: 0 0 0 8px rgba(61,220,132,0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(61,220,132,0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .pulse-dot {
    animation: none;
  }
}
</style>
